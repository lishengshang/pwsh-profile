# CI：双版本（PowerShell 7 + Windows PowerShell 5.1）语法解析与冒烟验证
# 对应 AGENTS.md「提交前验证」的自动化：
#   1. 全仓库 .ps1 语法解析（5.1 兼容红线：禁 ?. / ?? 等 PS7 专属语法）
#   2. profile 冒烟（入口 dot-source + 命令类型断言——依赖优雅降级，CI 裸环境可跑）
#   3. setup.ps1 幂等性（-SkipTools -Yes 连跑两次，第二次应全部跳过）
#   4. Pester 测试套件（tests/，仅 pwsh 矩阵作业运行）
#   5. PSScriptAnalyzer 新增违规门禁（基线提交快照比对，仅 pwsh 矩阵作业运行）
#   6. 规范校验作业（提交信息格式 + 注释交叉引用真实性，见 conventions 作业）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: ${{ matrix.shell-name }}
    runs-on: windows-latest
    # 步骤级 steps.shell 字段不允许引用 matrix（静态校验报 Unrecognized
    # named-value），须在作业级 defaults.run.shell 里统一指定让步骤继承
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: pwsh
            shell-name: PowerShell 7
          - shell: powershell
            shell-name: Windows PowerShell 5.1
    env:
      # 5.1 作业里 runner 预装了 pwsh，会触发「建议改用 pwsh」轻提示；CI 里关掉
      PWSH_PROFILE_QUIET: '1'
    steps:
      - uses: actions/checkout@v4

      - name: 语法解析全部 .ps1
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Filter *.ps1 |
              Where-Object { $_.FullName -notmatch '\\Modules\\' })
          if (-not $files.Count) { throw 'No PowerShell scripts found' }
          $failed = $false
          foreach ($f in $files) {
              $errs = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $f.FullName, [ref]$null, [ref]$errs)
              if ($errs) {
                  $failed = $true
                  Write-Host "::error file=$($f.FullName.Substring($env:GITHUB_WORKSPACE.Length + 1))::$($errs[0].Message)"
                  $errs | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
              }
          }
          if ($failed) { throw "Syntax errors found in $($files.Count) file(s)" }
          Write-Host "Syntax OK: $($files.Count) PowerShell script(s)"

      - name: setup.ps1 幂等性（连跑两次，-SkipTools 不装任何东西）
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          $ErrorActionPreference = 'Stop'
          Set-Location $env:GITHUB_WORKSPACE
          # 幂等性用状态判定而非输出匹配：Write-Host 走信息流无法可靠捕获
          # （5.1 下完全不可捕获），输出匹配是空转断言
          $regPath = Join-Path $env:LOCALAPPDATA 'pwsh-profile\linked-targets.json'
          $countEntries = {
              if (Test-Path $regPath) {
                  @(Get-Content $regPath -Raw | ConvertFrom-Json).Count
              } else { 0 }
          }
          $profileParent = Split-Path $PROFILE
          $countBackups = {
              @(Get-ChildItem $profileParent -Filter 'backup-*' -Directory -ErrorAction SilentlyContinue).Count
          }

          .\setup.ps1 -SkipTools -Yes
          if (-not $?) { throw 'First setup invocation failed' }
          $entriesAfterFirst = & $countEntries
          $backupsAfterFirst = & $countBackups

          # 第二次：不得新建链接、不得新增备份、注册表条目数不得变化
          .\setup.ps1 -SkipTools -Yes
          if (-not $?) { throw 'Second setup invocation failed' }
          $entriesAfterSecond = & $countEntries
          if ($entriesAfterSecond -ne $entriesAfterFirst) {
              throw "Registry entry count changed: $entriesAfterFirst -> $entriesAfterSecond"
          }
          $backupsAfterSecond = & $countBackups
          if ($backupsAfterSecond -gt $backupsAfterFirst) {
              throw 'Second setup run created a backup directory; idempotency check failed'
          }
          Write-Host 'setup idempotency OK'

      - name: profile 冒烟（dot-source 入口 + 命令类型断言）
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          $ErrorActionPreference = 'Stop'
          Set-Location $env:GITHUB_WORKSPACE
          # 入口用 $PSScriptRoot 定位子模块，仓库内直接 dot-source 即可；
          # CI 无外部工具，全链路走优雅降级路径（本身就是被测行为之一）
          . .\Microsoft.PowerShell_profile.ps1

          # 断言命令类型而非仅存在性：命令解析优先级为 Alias > Function，
          # 只判 Get-Command 非空会让被内置别名遮蔽的名字（如 gcm→Get-Command）
          # 恒真通过——历史事故：git 简写 gcm/gc/gp/gl/gcb 定义后全程不可用而 CI 全绿
          # 清单只收录无条件定义的名字；随外部工具存在与否才定义的
          # （cat/find/y/lg）不在此列，条件分支由各自降级路径断言覆盖
          $needFunction = @(
              '..', '...', '....', 'mkcd', 'ls', 'll', 'la', 'lt', 'llt',
              'profile-edit', 'psync', 'touch', 'which', 'grep', 'unzip',
              'gs', 'ga', 'gaa', 'gpl', 'gd', 'gds', 'gco', 'gb', 'gst',
              'grs', 'gbn', 'gquick', 'glog', 'gup', 'gclean',
              'ps-reboot', 'ps-shutdown', 'ps-hibernate', 'ps-suspend', 'ps-lock',
              'Get-PublicIP', 'Get-PortProcess', 'Stop-Port', 'wup', 'wum',
              'codehere', 'hashcheck', 'hashadd', 'wallpaper'
          )
          $bad = @()
          foreach ($name in $needFunction) {
              $cmd = Get-Command $name -ErrorAction Ignore
              if (-not $cmd) { $bad += "$name（profile 加载后缺失）"; continue }
              if ($cmd.CommandType -ne 'Function') {
                  $bad += "$name（解析为 $($cmd.CommandType)，疑似被内置别名遮蔽）"
              }
          }

          # profile 自有别名须为 Alias 且解析到本仓库的实现函数
          $needAlias = @{
              ep = 'profile-edit'; ch = 'codehere'; lock = 'ps-lock'
              myip = 'Get-PublicIP'; portof = 'Get-PortProcess'; killport = 'Stop-Port'
          }
          foreach ($name in $needAlias.Keys) {
              $cmd = Get-Command $name -ErrorAction Ignore
              if (-not $cmd -or $cmd.CommandType -ne 'Alias') {
                  $bad += "$name（应为指向 $($needAlias[$name]) 的别名）"; continue
              }
              $resolved = $cmd.ResolvedCommand
              if (-not $resolved -or $resolved.Name -ne $needAlias[$name]) {
                  $bad += "$name（别名未解析到 $($needAlias[$name])）"
              }
          }

          if ($bad.Count) {
              $bad | ForEach-Object { Write-Host "::error::$_" }
              throw "profile 命令断言失败：$($bad.Count) 项"
          }

          if (-not (Get-Command prompt -ErrorAction Ignore)) { throw 'prompt is not defined' }
          # touch GNU 语义回归：已存在文件不得清空内容
          $t = Join-Path $env:TEMP "ci-touch-$PID.txt"
          Set-Content -Path $t -Value 'sentinel'
          touch $t
          if ((Get-Content $t) -ne 'sentinel') { throw 'touch modified existing file contents' }
          Remove-Item $t -Force
          Write-Host "Smoke test OK: $($needFunction.Count) functions + $($needAlias.Count) aliases + prompt + touch semantics"

      - name: Pester 测试套件（仅 pwsh 矩阵作业运行）
        if: matrix.shell == 'pwsh'
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $pester = Get-Module Pester -ListAvailable |
              Where-Object { $_.Version -ge [version]'5.0.0' } |
              Sort-Object Version -Descending | Select-Object -First 1
          if (-not $pester) {
              Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Import-Module Pester -MinimumVersion 5.0
          $config = [PesterConfiguration]::Default
          $config.Run.Path = Join-Path $env:GITHUB_WORKSPACE 'tests'
          # 用 -Configuration 传参时，返回对象由 Run.PassThru 控制（命令行
          # -PassThru 被忽略）；Pester 6 起默认不返回，下方 FailedCount 判空
          # 恒假会静默放行失败。该配置项 Pester 5 同样支持
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Normal'
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) {
              throw "Pester failed: $($result.FailedCount) test(s), $($result.PassedCount) passed"
          }
          Write-Host "Pester OK: $($result.PassedCount) test(s) passed"

      - name: PSScriptAnalyzer 新增违规门禁（与基线提交比对）
        if: matrix.shell == 'pwsh'
        env:
          # PR 以目标分支 tip 为基线；push 以上一提交为基线（首次推送为全零则跳过）
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          if (-not $env:BASE_SHA -or $env:BASE_SHA -like '0000000*') {
              Write-Host 'PSA 门禁：无基线提交（首次推送），跳过比对'
              exit 0
          }
          # 浅检出下补齐基线提交对象（比对树所需）
          git fetch --no-tags --depth=1 origin $env:BASE_SHA
          .\Scripts\Compare-PsaBaseline.ps1 -BaseSha $env:BASE_SHA

  # 独立作业而非并入 verify 矩阵：区间校验要完整历史，而矩阵作业刻意用默认
  # 浅检出跑 PSA 的 depth=1 fetch；混在一起会拖慢两个版本作业，且 5.1 矩阵
  # 跑这份校验没有额外价值（校验的是文本，不涉及版本兼容）
  conventions:
    name: 规范校验（提交信息 + 注释交叉引用）
    runs-on: windows-latest
    env:
      # PR 以目标分支 tip 为基线；push 以上一提交为基线（首次推送为全零则跳过区间）
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      # 逐条校验区间内的提交信息需要完整历史（checkout 默认 depth=1 只有 HEAD）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 提交信息格式 + 引用真实性
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $range = $null
          if ($env:BASE_SHA -and $env:BASE_SHA -notlike '0000000*') {
              git merge-base --is-ancestor $env:BASE_SHA HEAD 2>$null
              if ($LASTEXITCODE -eq 0) {
                  $range = "$($env:BASE_SHA)..HEAD"
              } else {
                  # rebase / force-push 后基线可能不再是祖先，退化为只校验 HEAD 一条
                  Write-Host "基线提交不在当前历史中，退化为只校验 HEAD"
                  $range = 'HEAD~1..HEAD'
              }
          } else {
              Write-Host '无基线提交（首次推送），跳过区间校验'
          }
          .\Scripts\Check-CommitMsg.ps1 -CheckRefs
          if ($range) { .\Scripts\Check-CommitMsg.ps1 -Range $range }
