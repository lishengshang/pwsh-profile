# CI：双版本（PowerShell 7 + Windows PowerShell 5.1）语法解析与冒烟验证
# 对应 AGENTS.md「提交前验证」的自动化：
#   1. 全仓库 .ps1 语法解析（5.1 兼容红线：禁 ?. / ?? 等 PS7 专属语法）
#   2. profile 冒烟（入口 dot-source + 核心命令存在性——依赖优雅降级，CI 裸环境可跑）
#   3. setup.ps1 幂等性（-SkipTools -Yes 连跑两次，第二次应全部跳过）
# PSScriptAnalyzer 待 baseline 建立后追加（见 TODO.md）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: ${{ matrix.shell-name }}
    runs-on: windows-latest
    # 步骤级 steps.shell 字段不允许引用 matrix（静态校验报 Unrecognized
    # named-value），须在作业级 defaults.run.shell 里统一指定让步骤继承
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: pwsh
            shell-name: PowerShell 7
          - shell: powershell
            shell-name: Windows PowerShell 5.1
    env:
      # 5.1 作业里 runner 预装了 pwsh，会触发「建议改用 pwsh」轻提示；CI 里关掉
      PWSH_PROFILE_QUIET: '1'
    steps:
      - uses: actions/checkout@v4

      - name: 语法解析全部 .ps1
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Filter *.ps1 |
              Where-Object { $_.FullName -notmatch '\\Modules\\' })
          if (-not $files.Count) { throw '未找到任何 .ps1 文件' }
          $failed = $false
          foreach ($f in $files) {
              $errs = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $f.FullName, [ref]$null, [ref]$errs)
              if ($errs) {
                  $failed = $true
                  Write-Host "::error file=$($f.FullName.Substring($env:GITHUB_WORKSPACE.Length + 1))::$($errs[0].Message)"
                  $errs | ForEach-Object { Write-Host "  $($_.Extent.StartLineNumber) 行: $($_.Message)" }
              }
          }
          if ($failed) { throw "共 $($files.Count) 个文件中存在语法错误" }
          Write-Host "语法 OK：$($files.Count) 个 .ps1 文件"

      - name: setup.ps1 幂等性（连跑两次，-SkipTools 不装任何东西）
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          $ErrorActionPreference = 'Stop'
          Set-Location $env:GITHUB_WORKSPACE
          # 幂等性用状态判定而非输出匹配：Write-Host 走信息流无法可靠捕获
          # （5.1 下完全不可捕获），输出匹配是空转断言
          $regPath = Join-Path $env:LOCALAPPDATA 'pwsh-profile\linked-targets.json'
          $countEntries = {
              if (Test-Path $regPath) {
                  @(Get-Content $regPath -Raw | ConvertFrom-Json).Count
              } else { 0 }
          }
          $profileParent = Split-Path $PROFILE
          $countBackups = {
              @(Get-ChildItem $profileParent -Filter 'backup-*' -Directory -ErrorAction SilentlyContinue).Count
          }

          .\setup.ps1 -SkipTools -Yes
          if ($LASTEXITCODE -ne 0) { throw "第一次 setup 失败 (exit $LASTEXITCODE)" }
          $entriesAfterFirst = & $countEntries
          $backupsAfterFirst = & $countBackups

          # 第二次：不得新建链接、不得新增备份、注册表条目数不得变化
          .\setup.ps1 -SkipTools -Yes
          if ($LASTEXITCODE -ne 0) { throw "第二次 setup 失败 (exit $LASTEXITCODE)" }
          if (& $countEntries -ne $entriesAfterFirst) {
              throw "注册表条目数变化: $entriesAfterFirst -> $(& $countEntries)（幂等性破坏）"
          }
          if (& $countBackups -gt $backupsAfterFirst) {
              throw '第二次 setup 新建了备份目录——把用户配置当成了未管理文件（幂等性破坏）'
          }
          Write-Host 'setup 幂等性 OK'

      - name: profile 冒烟（dot-source 入口 + 核心命令存在性）
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          $ErrorActionPreference = 'Stop'
          Set-Location $env:GITHUB_WORKSPACE
          # 入口用 $PSScriptRoot 定位子模块，仓库内直接 dot-source 即可；
          # CI 无外部工具，全链路走优雅降级路径（本身就是被测行为之一）
          . .\Microsoft.PowerShell_profile.ps1
          $need = @('gs', 'ga', 'gcm', 'gp', 'gl', 'psync', 'ep', 'ch', 'wum',
                    'touch', 'which', 'unzip', 'mkcd', 'gquick')
          foreach ($name in $need) {
              if (-not (Get-Command $name -ErrorAction Ignore)) {
                  throw "profile 加载后缺少命令: $name"
              }
          }
          # eza 缺失时 ll 必须回退为 Get-ChildItem 包装函数（降级路径验证）
          if (-not (Get-Command ll -ErrorAction Ignore)) { throw '缺少命令: ll' }
          if (-not (Get-Command prompt -ErrorAction Ignore)) { throw 'prompt 未定义' }
          # touch GNU 语义回归：已存在文件不得清空内容
          $t = Join-Path $env:TEMP "ci-touch-$PID.txt"
          Set-Content -Path $t -Value 'sentinel'
          touch $t
          if ((Get-Content $t) -ne 'sentinel') { throw 'touch 清空了已存在文件内容' }
          Remove-Item $t -Force
          Write-Host "冒烟 OK：$($need.Count) 个核心命令 + prompt + touch 语义"
